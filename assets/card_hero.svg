<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 190" width="380" height="190">
  <defs>
    <style>
      .bg { fill: #171717; rx: 12px; stroke: #2a2a2a; stroke-width: 1.5; }
      .mascot { fill: #e5d5be; }
      .face { fill: #171717; }
      .bubble-bg { fill: #202020; rx: 8px; stroke: #333333; stroke-width: 1; }
      .text-title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; }
      .text-body { fill: #cfc2ae; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; line-height: 1.4; }
      .text-highlight { fill: #ffffff; font-weight: 700; text-decoration: underline; }
    </style>
  </defs>
  <rect width="380" height="190" class="bg"/>
  
  <!-- Silhouette trees background -->
  <path d="M10 190 L10 150 L25 125 L40 150 L55 130 L70 160 L85 140 L100 170 L120 190 Z" fill="#1e1e1e"/>
  
  <!-- Mascot character -->
  <g transform="translate(25, 60)">
    <path d="M0 130 C0 80, 20 50, 50 50 C80 50, 100 80, 100 130 Z" class="mascot"/>
    <ellipse cx="50" cy="40" rx="42" ry="42" class="mascot"/>
    <!-- Face -->
    <circle cx="40" cy="38" r="3.5" class="face"/>
    <circle cx="58" cy="38" r="3.5" class="face"/>
    <path d="M44 46 Q49 53 54 46" fill="none" stroke="#171717" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble 1 -->
  <rect x="135" y="25" width="225" height="62" class="bubble-bg"/>
  <text x="147" y="44" class="text-body">Hey, I'm <tspan class="text-highlight">keyrex</tspan>! Lead engineer at</text>
  <text x="147" y="60" class="text-body"><tspan class="text-highlight">Keyrex Development</tspan>, building tools &amp;</text>
  <text x="147" y="76" class="text-body">client architectures.</text>

  <!-- Speech bubble 2 -->
  <rect x="135" y="98" width="225" height="68" class="bubble-bg"/>
  <text x="147" y="118" class="text-body">Creator of <tspan class="text-highlight">KeyWare DMs</tspan>, high-speed</text>
  <text x="147" y="134" class="text-body">desktop suites, and zero-overhead</text>
  <text x="147" y="150" class="text-body">system modifications.</text>
</svg>
