    <text x="315" y="144" class="mono delta">0.018ms</text>
    <text x="395" y="144" class="mono state-dim">[VERIFY]</text>
  </g>

  <g class="r4">
    <text x="24" y="170" class="mono addr">0x7F20</text>
    <text x="100" y="170" class="mono hook">env::metatable_integrity</text>
    <text x="315" y="170" class="mono delta">0.004ms</text>
    <text x="395" y="170" class="mono state">[LOCKED]</text>
  </g>

  <g class="r5">
    <text x="24" y="196" class="mono addr">0x7F2C</text>
    <text x="100" y="196" class="mono hook">sync::tick_desync_solver</text>
    <text x="315" y="196" class="mono delta">0.009ms</text>
    <text x="395" y="196" class="mono state">[ACTIVE]</text>
  </g>

  <text x="24" y="228" class="mono footer">// 0 FALSE POSITIVES  ·  SERVER-SIDE DETERMINISTIC</text>

