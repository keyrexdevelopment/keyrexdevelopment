<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250">
  <defs>
    <pattern id="microGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#141417" stroke-width="0.6"/>
    </pattern>

    <clipPath id="type1">
      <rect x="514" y="152" width="0" height="22">
        <animate attributeName="width" from="0" to="360" dur="1.4s" begin="0.2s" fill="freeze" calcMode="discrete" values="0;40;80;120;160;200;240;280;320;360"/>
      </rect>
    </clipPath>
    <clipPath id="type2">
      <rect x="514" y="178" width="0" height="22">
        <animate attributeName="width" from="0" to="360" dur="1.2s" begin="1.5s" fill="freeze" calcMode="discrete" values="0;45;90;135;180;225;270;315;360"/>
      </rect>
    </clipPath>

    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      .hdr { fill: #71717a; font-size: 10.5px; font-weight: 600; letter-spacing: 1.2px; }
      .col-hdr { fill: #52525b; font-size: 10px; font-weight: 700; letter-spacing: 1.1px; }
      .addr { fill: #71717a; font-size: 11px; }
      .hook { fill: #fafafa; font-size: 11px; font-weight: 500; }
      .delta { fill: #a1a1aa; font-size: 11px; }
      .state { fill: #e4e4e7; font-size: 10.5px; font-weight: 700; letter-spacing: 0.6px; }
      .state-dim { fill: #a1a1aa; font-size: 10.5px; font-weight: 600; letter-spacing: 0.6px; }
      .footer { fill: #52525b; font-size: 10px; letter-spacing: 0.8px; }
      .status-txt { fill: #e4e4e7; font-size: 10px; font-weight: 700; letter-spacing: 1px; }
      .term-cmd { fill: #fafafa; font-size: 11px; font-weight: 600; }
      .term-out { fill: #a1a1aa; font-size: 11px; }
      .term-wait { fill: #e4e4e7; font-size: 11px; opacity: 0; animation: rowIn 0.3s ease forwards 2.8s; }

      .pulse { animation: pulseOpacity 2.2s ease-in-out infinite; }
      .cursor { opacity: 0; animation: cursorBlink 1s step-end infinite 2.8s; }

      .r1 { opacity: 0; animation: rowIn 0.35s ease forwards 0.1s; }
      .r2 { opacity: 0; animation: rowIn 0.35s ease forwards 0.3s; }
      .r3 { opacity: 0; animation: rowIn 0.35s ease forwards 0.5s; }
      .r4 { opacity: 0; animation: rowIn 0.35s ease forwards 0.7s; }
      .r5 { opacity: 0; animation: rowIn 0.35s ease forwards 0.9s; }

      @keyframes rowIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes pulseOpacity {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Base Frame -->
  <rect x="0.75" y="0.75" width="898.5" height="248.5" rx="8" fill="#09090b" stroke="#1c1c1f" stroke-width="1.5"/>
  <rect x="1.5" y="1.5" width="897" height="247" rx="7" fill="url(#microGrid)" opacity="0.65"/>

  <!-- Top Header Bar -->
  <line x1="1" y1="34" x2="899" y2="34" stroke="#1c1c1f" stroke-width="1"/>
  <text x="20" y="21" class="mono hdr">+  KEYREX // LUAU VM &amp; NETWORK TELEMETRY</text>

  <!-- Monochrome Status Indicator -->
  <circle cx="776" cy="17.5" r="3" fill="#fafafa" class="pulse"/>
  <text x="786" y="21" class="mono status-txt">60.0 HZ / ACTIVE</text>

  <!-- Vertical Column Divider -->
  <line x1="490" y1="34" x2="490" y2="249" stroke="#1c1c1f" stroke-width="1"/>

  <!-- LEFT COLUMN: Memory / Hook Table -->
  <text x="24" y="60" class="mono col-hdr">ADDR</text>
  <text x="100" y="60" class="mono col-hdr">SUBSYSTEM / HOOK</text>
  <text x="315" y="60" class="mono col-hdr">DELTA</text>
  <text x="395" y="60" class="mono col-hdr">STATE</text>
  <line x1="24" y1="70" x2="465" y2="70" stroke="#1c1c1f" stroke-width="1"/>

  <g class="r1">
    <text x="24" y="92" class="mono addr">0x7F01</text>
    <text x="100" y="92" class="mono hook">luau_vm::bytecode_guard</text>
    <text x="315" y="92" class="mono delta">0.011ms</text>
    <text x="395" y="92" class="mono state">[LOCKED]</text>
  </g>

  <g class="r2">
    <text x="24" y="118" class="mono addr">0x7F08</text>
    <text x="100" y="118" class="mono hook">net::remote_rate_limiter</text>
    <text x="315" y="118" class="mono delta">0.006ms</text>
    <text x="395" y="118" class="mono state">[ACTIVE]</text>
  </g>

  <g class="r3">
