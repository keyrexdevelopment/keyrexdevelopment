<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 190" width="210" height="190">
  <defs>
    <style>
      .bg { fill: #111111; rx: 12px; stroke: #262626; stroke-width: 1.5; }
      .mascot { fill: #ffffff; }
      .face { fill: #111111; }
      .mountain1 { fill: #181818; }
      .mountain2 { fill: #202020; }
      .bubble-bg { fill: #1a1a1a; rx: 6px; stroke: #2d2d2d; stroke-width: 1; }
      .text-body { fill: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; }
    </style>
  </defs>
  <rect width="210" height="190" class="bg"/>

  <!-- Mountain silhouette -->
  <polygon points="20,190 70,70 120,190" class="mountain1"/>
  <polygon points="70,190 130,40 190,190" class="mountain2"/>
  <polygon points="120,190 170,90 210,190" class="mountain1"/>

  <!-- Flag on mountain top -->
  <line x1="130" y1="40" x2="130" y2="22" stroke="#ffffff" stroke-width="2"/>
  <polygon points="130,22 148,28 130,34" fill="#ffffff"/>

  <!-- Speech bubble -->
  <rect x="25" y="105" width="105" height="42" class="bubble-bg"/>
  <text x="33" y="122" class="text-body">I hope you enjoy</text>
  <text x="33" y="137" class="text-body">KeyWare mods!</text>

  <!-- Mascot in scarf -->
  <g transform="translate(140, 115)">
    <path d="M0 75 C0 45, 10 30, 30 30 C50 30, 60 45, 60 75 Z" class="mascot"/>
    <circle cx="30" cy="22" r="22" class="mascot"/>
    <circle cx="24" cy="20" r="2" class="face"/>
    <circle cx="34" cy="20" r="2" class="face"/>
    <path d="M26 26 Q29 30 32 26" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Scarf in silver -->
    <path d="M12 36 Q30 42 48 36 Q42 46 12 44 Z" fill="#cfcfcf"/>
    <rect x="36" y="40" width="8" height="24" rx="2" fill="#cfcfcf" transform="rotate(10 36 40)"/>
  </g>
</svg>
