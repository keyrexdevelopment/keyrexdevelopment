<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 190" width="190" height="190">
  <defs>
    <style>
      .bg { fill: #111111; rx: 12px; stroke: #262626; stroke-width: 1.5; }
      .mascot { fill: #ffffff; }
      .face { fill: #111111; }
      .code-line { fill: #555555; font-family: monospace; font-size: 8.5px; }
      .btn-arrow { fill: #1a1a1a; stroke: #2d2d2d; stroke-width: 1; }
    </style>
  </defs>
  <rect width="190" height="190" class="bg"/>

  <!-- Code background snippet -->
  <g transform="translate(14, 110)">
    <text x="0" y="0" class="code-line">const keyware = () =&gt; {</text>
    <text x="8" y="14" class="code-line">  if (event.type) {</text>
    <text x="16" y="28" class="code-line">    dispatch.hook();</text>
    <text x="8" y="42" class="code-line">  }</text>
    <text x="0" y="56" class="code-line">};</text>
  </g>

  <!-- Big Monochrome GitHub Octocat Circle in Center -->
  <g transform="translate(60, 30)">
    <circle cx="35" cy="35" r="35" fill="#ffffff"/>
    <!-- Octocat Silhouette -->
    <path d="M35 15 C23.95 15 15 23.95 15 35 C15 43.84 20.73 51.34 28.66 53.98 C29.66 54.16 30.02 53.55 30.02 53.02 C30.02 52.54 30 51.27 30 49.58 C24.44 50.79 23.27 46.9 23.27 46.9 C22.36 44.59 21.05 43.97 21.05 43.97 C19.23 42.73 21.19 42.75 21.19 42.75 C23.2 42.89 24.26 44.81 24.26 44.81 C26.05 47.87 28.95 47 30.1 46.48 C30.28 45.18 30.8 44.29 31.38 43.79 C26.94 43.29 22.28 41.58 22.28 33.92 C22.28 31.74 23.06 29.95 24.34 28.56 C24.13 28.05 23.45 26.02 24.54 23.27 C24.54 23.27 26.22 22.73 30.04 25.32 C31.64 24.87 33.34 24.65 35.04 24.64 C36.74 24.65 38.44 24.87 40.04 25.32 C43.86 22.73 45.54 23.27 45.54 23.27 C46.63 26.02 45.95 28.05 45.74 28.56 C47.02 29.95 47.8 31.74 47.8 33.92 C47.8 41.6 43.13 43.28 38.68 43.77 C39.4 44.39 40.04 45.61 40.04 47.47 C40.04 50.13 40.02 52.28 40.02 52.93 C40.02 53.47 40.38 54.09 41.4 53.89 C49.31 51.24 55.04 43.79 55.04 35 C55.04 23.95 46.09 15 35 15 Z" fill="#111111"/>
  </g>

  <!-- Mascot Typing at Laptop -->
  <g transform="translate(68, 120)">
    <circle cx="20" cy="18" r="16" class="mascot"/>
    <circle cx="16" cy="16" r="1.8" class="face"/><circle cx="24" cy="16" r="1.8" class="face"/>
    <path d="M18 21 Q20 24 22 21" fill="none" stroke="#111111" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M8 34 C8 24 14 18 26 18 C38 18 44 24 44 34 Z" class="mascot"/>
    <!-- Laptop -->
    <polygon points="12,50 38,50 36,40 14,40" fill="#222222"/>
    <polygon points="14,40 36,40 34,26 16,26" fill="#ffffff"/>
  </g>

  <!-- Arrow button in bottom right -->
  <g transform="translate(148, 145)">
    <circle cx="14" cy="14" r="13" class="btn-arrow"/>
    <path d="M10 18 L18 10 M12 10 L18 10 L18 16" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
