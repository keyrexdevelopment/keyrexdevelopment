<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 190" width="190" height="190">
  <defs>
    <style>
      .bg { fill: #111111; rx: 12px; stroke: #262626; stroke-width: 1.5; }
      .bar-1 { fill: #ffffff; rx: 3px; }
      .bar-2 { fill: #d0d0d0; rx: 3px; }
      .bar-3 { fill: #999999; rx: 3px; }
      .bar-4 { fill: #666666; rx: 3px; }
      .bar-5 { fill: #444444; rx: 3px; }
      .bar-6 { fill: #282828; rx: 3px; }
      .icon-tag { fill: #111111; font-family: monospace; font-size: 9px; font-weight: 800; }
      .stat-text { fill: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
    </style>
  </defs>
  <rect width="190" height="190" class="bg"/>

  <!-- Row 1: TS -->
  <g transform="translate(18, 20)">
    <rect x="0" y="0" width="120" height="20" class="bar-1"/>
    <text x="6" y="14" class="icon-tag">TS</text>
    <text x="126" y="14" class="stat-text">920h</text>
  </g>

  <!-- Row 2: JS -->
  <g transform="translate(18, 46)">
    <rect x="0" y="0" width="105" height="20" class="bar-2"/>
    <text x="6" y="14" class="icon-tag">JS</text>
    <text x="111" y="14" class="stat-text">780h</text>
  </g>

  <!-- Row 3: C++ -->
  <g transform="translate(18, 72)">
    <rect x="0" y="0" width="85" height="20" class="bar-3"/>
    <text x="4" y="14" class="icon-tag">C++</text>
    <text x="91" y="14" class="stat-text">560h</text>
  </g>

  <!-- Row 4: Electron -->
  <g transform="translate(18, 98)">
    <rect x="0" y="0" width="60" height="20" class="bar-4"/>
    <text x="6" y="14" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700">⚛</text>
    <text x="66" y="14" class="stat-text">340h</text>
  </g>

  <!-- Row 5: Node -->
  <g transform="translate(18, 124)">
    <rect x="0" y="0" width="40" height="20" class="bar-5"/>
    <text x="6" y="14" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700">⬢</text>
    <text x="46" y="14" class="stat-text">190h</text>
  </g>

  <!-- Row 6: Git -->
  <g transform="translate(18, 150)">
    <rect x="0" y="0" width="30" height="20" class="bar-6"/>
    <text x="6" y="14" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700">⌥</text>
    <text x="36" y="14" class="stat-text">150h</text>
  </g>
</svg>
