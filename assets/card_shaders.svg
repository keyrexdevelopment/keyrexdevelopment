<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 190" width="180" height="190">
  <defs>
    <style>
      .bg { fill: #111111; rx: 12px; stroke: #262626; stroke-width: 1.5; }
      .header-title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 1px; }
      .theme-row { fill: #181818; rx: 6px; stroke: #262626; stroke-width: 1; }
      .theme-active { fill: #222222; rx: 6px; stroke: #ffffff; stroke-width: 1; }
      .theme-name { fill: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; }
      .theme-name-active { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 800; }
      .dot { fill: #ffffff; }
      .dot-dim { fill: #555555; }
      .sparkle { fill: #ffffff; }
    </style>
  </defs>
  <rect width="180" height="190" class="bg"/>

  <!-- Top Title & Icon -->
  <g transform="translate(16, 22)">
    <!-- Sparkle Icon -->
    <path d="M0 6 Q6 6 6 0 Q6 6 12 6 Q6 6 6 12 Q6 6 0 6 Z" class="sparkle"/>
    <text x="18" y="9" class="header-title">THEME SHADERS</text>
  </g>

  <!-- Theme 1: Frosted Glass (Active) -->
  <g transform="translate(14, 42)">
    <rect width="152" height="28" class="theme-active"/>
    <circle cx="16" cy="14" r="4" class="dot"/>
    <text x="28" y="17.5" class="theme-name-active">FROSTED GLASS</text>
    <!-- Mini glass badge -->
    <rect x="114" y="6.5" width="30" height="15" rx="3" fill="#ffffff" fill-opacity="0.15"/>
    <text x="120" y="17" fill="#ffffff" font-family="monospace" font-size="8">BLUR</text>
  </g>

  <!-- Theme 2: Cyber Neon -->
  <g transform="translate(14, 76)">
    <rect width="152" height="28" class="theme-row"/>
    <circle cx="16" cy="14" r="4" class="dot-dim"/>
    <text x="28" y="17.5" class="theme-name">CYBER MATRIX</text>
    <rect x="114" y="6.5" width="30" height="15" rx="3" fill="#242424"/>
    <text x="120" y="17" fill="#777777" font-family="monospace" font-size="8">NEON</text>
  </g>

  <!-- Theme 3: Thermal Ember -->
  <g transform="translate(14, 110)">
    <rect width="152" height="28" class="theme-row"/>
    <circle cx="16" cy="14" r="4" class="dot-dim"/>
    <text x="28" y="17.5" class="theme-name">THERMAL EMBER</text>
    <rect x="114" y="6.5" width="30" height="15" rx="3" fill="#242424"/>
    <text x="120" y="17" fill="#777777" font-family="monospace" font-size="8">GLOW</text>
  </g>

  <!-- Theme 4: Obsidian Mono -->
  <g transform="translate(14, 144)">
    <rect width="152" height="28" class="theme-row"/>
    <circle cx="16" cy="14" r="4" class="dot-dim"/>
    <text x="28" y="17.5" class="theme-name">OBSIDIAN MONO</text>
    <rect x="114" y="6.5" width="30" height="15" rx="3" fill="#242424"/>
    <text x="120" y="17" fill="#777777" font-family="monospace" font-size="8">DARK</text>
  </g>
</svg>
