<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 190" width="200" height="190">
  <defs>
    <style>
      .bg { fill: #111111; rx: 12px; stroke: #262626; stroke-width: 1.5; }
      .header-tag { fill: #222222; rx: 4px; }
      .text-tag { fill: #ffffff; font-family: monospace; font-size: 8.5px; font-weight: 700; }
      .text-title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 800; letter-spacing: 0.5px; }
      .feature-row { fill: #181818; rx: 5px; stroke: #242424; stroke-width: 1; }
      .feat-text { fill: #cfcfcf; font-family: monospace; font-size: 8.5px; }
      .feat-bold { fill: #ffffff; font-weight: 700; }
      .btn-arrow { fill: #1a1a1a; stroke: #2d2d2d; stroke-width: 1; }
    </style>
  </defs>
  <rect width="200" height="190" class="bg"/>

  <!-- Top Header -->
  <g transform="translate(16, 20)">
    <rect width="36" height="15" class="header-tag"/>
    <text x="5" y="11" class="text-tag">SUITE</text>
    <text x="44" y="12" class="text-title">KEYWARE CORE</text>
  </g>

  <!-- Feature 1: 0ms React DOM -->
  <g transform="translate(14, 46)">
    <rect width="172" height="26" class="feature-row"/>
    <text x="10" y="17" class="feat-text"><tspan class="feat-bold">⚡ 0ms</tspan> REACT-SAFE DOM</text>
  </g>

  <!-- Feature 2: Dispatcher Audio Hook -->
  <g transform="translate(14, 76)">
    <rect width="172" height="26" class="feature-row"/>
    <text x="10" y="17" class="feat-text"><tspan class="feat-bold">🎧 AUDIO</tspan> DISPATCH HOOK</text>
  </g>

  <!-- Feature 3: GPU Shaders Engine -->
  <g transform="translate(14, 106)">
    <rect width="172" height="26" class="feature-row"/>
    <text x="10" y="17" class="feat-text"><tspan class="feat-bold">✨ GPU</tspan> SHADER ENGINE</text>
  </g>

  <!-- Feature 4: Memory Isolation -->
  <g transform="translate(14, 136)">
    <rect width="130" height="26" class="feature-row"/>
    <text x="10" y="17" class="feat-text"><tspan class="feat-bold">🔒 ZERO</tspan> OVERHEAD</text>
  </g>

  <!-- Arrow button in bottom right -->
  <g transform="translate(156, 137)">
    <circle cx="12" cy="12" r="12" class="btn-arrow"/>
    <path d="M8 16 L16 8 M10 8 L16 8 L16 14" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
