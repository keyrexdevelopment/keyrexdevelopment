<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d10"/>
      <stop offset="100%" stop-color="#11141a"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="termClip">
      <rect x="1" y="1" width="898" height="278" rx="12"/>
    </clipPath>
    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      .title { fill: #7d8590; font-size: 11.5px; font-weight: 600; letter-spacing: 0.5px; }
      .ascii { fill: #e6edf3; font-size: 11.5px; font-weight: 700; white-space: pre; }
      .ascii-sub { fill: #7d8590; font-size: 10.5px; letter-spacing: 1.5px; }
      .cmd { fill: #e6edf3; font-size: 12px; font-weight: 600; }
      .prompt { fill: #58a6ff; font-size: 12px; font-weight: 700; }
      .tag-ok { fill: #3fb950; font-size: 11.5px; font-weight: 700; }
      .tag-sys { fill: #a371f7; font-size: 11.5px; font-weight: 700; }
      .tag-net { fill: #58a6ff; font-size: 11.5px; font-weight: 700; }
      .tag-phy { fill: #d29922; font-size: 11.5px; font-weight: 700; }
      .log-text { fill: #b1bac4; font-size: 11.5px; }
      .metric { fill: #3fb950; font-size: 11.5px; font-weight: 700; }
      .bar-bg { fill: #21262d; font-size: 11px; }
      .bar-fg { fill: #3fb950; font-size: 11px; }

      .pulse-dot {
        animation: pulse 2s ease-in-out infinite;
      }
      .cursor {
        animation: blink 1s step-end infinite;
      }
      .scanline {
        animation: scan 5s linear infinite;
      }
      .ascii-glow {
        animation: glow 3.5s ease-in-out infinite;
      }

      .l1 { opacity: 0; animation: fadeIn 0.4s ease forwards 0.2s; }
      .l2 { opacity: 0; animation: fadeIn 0.4s ease forwards 0.7s; }
      .l3 { opacity: 0; animation: fadeIn 0.4s ease forwards 1.2s; }
      .l4 { opacity: 0; animation: fadeIn 0.4s ease forwards 1.7s; }
      .l5 { opacity: 0; animation: fadeIn 0.4s ease forwards 2.2s; }
      .l6 { opacity: 0; animation: fadeIn 0.4s ease forwards 2.7s; }

      .b1 { animation: barWave 2.4s ease-in-out infinite 0.0s; }
      .b2 { animation: barWave 2.4s ease-in-out infinite 0.3s; }
      .b3 { animation: barWave 2.4s ease-in-out infinite 0.6s; }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes scan {
        0% { transform: translateY(-60px); }
        100% { transform: translateY(300px); }
      }
      @keyframes glow {
        0%, 100% { fill: #e6edf3; }
        50% { fill: #ffffff; }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes barWave {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect x="1" y="1" width="898" height="278" rx="12" fill="url(#bgGrad)" stroke="#21262d" stroke-width="1.5"/>

  <!-- Subtle Scanline Overlay -->
  <g clip-path="url(#termClip)">
    <rect x="0" y="0" width="900" height="50" fill="url(#scanGrad)" class="scanline"/>
  </g>

  <!-- Title Bar -->
  <line x1="1" y1="36" x2="899" y2="36" stroke="#21262d" stroke-width="1"/>
  <circle cx="22" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="58" cy="18" r="5" fill="#27c93f"/>
  <text x="450" y="22" text-anchor="middle" class="mono title">keyrex-ac — runtime telemetry</text>

  <!-- Online Status Pill -->
  <rect x="802" y="9" width="80" height="18" rx="9" fill="#132318" stroke="#23482c" stroke-width="1"/>
  <circle cx="815" cy="18" r="3.5" fill="#3fb950" class="pulse-dot"/>
  <text x="824" y="21.5" class="mono" fill="#3fb950" font-size="10" font-weight="700">ONLINE</text>

  <!-- Left Column: ASCII Art & Telemetry Bars -->
  <g transform="translate(28, 72)">
    <text x="0" y="0"   class="mono ascii ascii-glow" xml:space="preserve"> _  _________   _______ _______  __</text>
    <text x="0" y="15"  class="mono ascii ascii-glow" xml:space="preserve">| |/ / ____\ \ / / ___ \ ____\ \/ /</text>
    <text x="0" y="30"  class="mono ascii ascii-glow" xml:space="preserve">| ' /|  _|  \ V /| |_/ /  _|  \  / </text>
    <text x="0" y="45"  class="mono ascii ascii-glow" xml:space="preserve">| . \| |___  | | |  _ &lt;| |___ /  \ </text>
    <text x="0" y="60"  class="mono ascii ascii-glow" xml:space="preserve">|_|\_\_____| |_| |_| \_\_____/_/\_\</text>

    <text x="0" y="88" class="mono ascii-sub">// ROBLOX ANTI-CHEAT ENGINE</text>

    <!-- Animated ASCII Bars -->
    <g transform="translate(0, 114)">
      <text x="0" y="0"  class="mono bar-fg b1" xml:space="preserve">VM GUARD   [████████████] 100%</text>
      <text x="0" y="18" class="mono bar-fg b2" xml:space="preserve">NET FILTER [████████████] 100%</text>
      <text x="0" y="36" class="mono bar-fg b3" xml:space="preserve">HEURISTICS [████████████] 0.02ms</text>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="368" y1="54" x2="368" y2="256" stroke="#21262d" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Right Column: Animated Terminal Feed -->
  <g transform="translate(394, 72)">
    <g class="l1">
      <text x="0" y="0" class="mono prompt">keyrex@ac:~$</text>
      <text x="92" y="0" class="mono cmd">./keyrex-ac --attach --strict</text>
    </g>

    <g class="l2" transform="translate(0, 32)">
      <text x="0" y="0" class="mono tag-sys">[SYS]</text>
      <text x="42" y="0" class="mono log-text">Luau VM integrity check .........</text>
      <text x="292" y="0" class="mono metric">PASS</text>
    </g>

    <g class="l3" transform="translate(0, 62)">
      <text x="0" y="0" class="mono tag-net">[NET]</text>
      <text x="42" y="0" class="mono log-text">RemoteEvent rate-limiter ........</text>
      <text x="292" y="0" class="mono metric">ARMED</text>
    </g>

    <g class="l4" transform="translate(0, 92)">
      <text x="0" y="0" class="mono tag-phy">[PHY]</text>
      <text x="42" y="0" class="mono log-text">CFrame &amp; Velocity heuristics ....</text>
      <text x="292" y="0" class="mono metric">ACTIVE</text>
    </g>

    <g class="l5" transform="translate(0, 122)">
      <text x="0" y="0" class="mono tag-ok">[SEC]</text>
      <text x="42" y="0" class="mono log-text">Anti-Tamper &amp; Desync shield .....</text>
      <text x="292" y="0" class="mono metric">LOCKED</text>
    </g>

    <g class="l6" transform="translate(0, 160)">
      <text x="0" y="0" class="mono prompt">&gt;</text>
      <text x="16" y="0" class="mono cmd">Zero bloat. Server-authoritative protection.</text>
      <rect x="356" y="-10" width="7" height="13" fill="#e6edf3" class="cursor"/>
    </g>
  </g>
</svg>
