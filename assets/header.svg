<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="920" height="240">
  <defs>
    <!-- Background Gradients & Glows -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d12"/>
      <stop offset="50%" stop-color="#12131a"/>
      <stop offset="100%" stop-color="#0e0f14"/>
    </linearGradient>
    <radialGradient id="glow-grad" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#5865f2" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#5865f2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-left" cx="20%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <style>
      .bg-rect { fill: url(#bg-grad); rx: 16px; stroke: #232530; stroke-width: 1.5; }
      .tag-pill { fill: #1c1e28; rx: 5px; stroke: #313547; stroke-width: 1; }
      .tag-text { fill: #8b92b3; font-family: monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 1.5px; }
      .title-main { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
      .title-name { fill: #7c88ff; }
      .desc-text { fill: #b0b4c8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; line-height: 1.6; }
      .desc-bold { fill: #ffffff; font-weight: 600; }
      .emblem-bg { fill: #171822; rx: 16px; stroke: #2a2d3d; stroke-width: 1.5; }
      .star { fill: #ffffff; }
    </style>
  </defs>

  <rect width="920" height="240" class="bg-rect"/>
  <rect width="920" height="240" fill="url(#glow-grad)" rx="16"/>
  <rect width="920" height="240" fill="url(#glow-left)" rx="16"/>

  <!-- Subtle ambient stars -->
  <circle cx="80" cy="45" r="1.5" class="star" opacity="0.6"/>
  <circle cx="240" cy="30" r="1" class="star" opacity="0.4"/>
  <circle cx="480" cy="50" r="1.5" class="star" opacity="0.5"/>
  <circle cx="780" cy="35" r="1" class="star" opacity="0.3"/>

  <!-- Left Content -->
  <g transform="translate(50, 42)">
    <!-- Tag Pill -->
    <g transform="translate(0, 0)">
      <rect width="260" height="24" class="tag-pill"/>
      <text x="12" y="16" class="tag-text">KEYREX DEVELOPMENT // STUDIO</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="58" class="title-main">Hey, my name is <tspan class="title-name">keyrex</tspan> 👋</text>

    <!-- Subtitle / Welcome Text -->
    <text x="0" y="92" class="desc-text">Welcome to my development space. I'm an independent software engineer focused on building</text>
    <text x="0" y="114" class="desc-text"><tspan class="desc-bold">high-performance client extensions</tspan>, reverse-engineered desktop tools, and tailored systems.</text>
    
    <!-- Philosophy line -->
    <text x="0" y="146" fill="#71768e" font-family="monospace" font-size="11.5px">✦ Zero bloat • Pure speed • Bespoke client architecture</text>
  </g>

  <!-- Right Geometric Monogram Emblem -->
  <g transform="translate(735, 45)">
    <rect width="135" height="150" class="emblem-bg"/>
    <!-- KW Stylized Monogram -->
    <g transform="translate(25, 25)">
      <!-- K -->
      <path d="M15 15 L15 85 M15 50 L65 15 M25 42 L72 85" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none"/>
      <!-- Ambient Circle Ring -->
      <circle cx="42" cy="50" r="46" stroke="#33374b" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/>
    </g>
  </g>
</svg>
