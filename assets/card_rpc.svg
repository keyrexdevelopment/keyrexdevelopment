<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 190" width="180" height="190">
  <defs>
    <style>
      .bg { fill: #171717; rx: 12px; stroke: #2a2a2a; stroke-width: 1.5; }
      .header-bg { fill: #202020; rx: 12px 12px 0 0; }
      .avatar { fill: #e5d5be; }
      .text-user { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; }
      .text-sub { fill: #8a8a8a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; }
      .game-box { fill: #1a1a1a; rx: 8px; stroke: #2e2e2e; stroke-width: 1; }
      .game-title { fill: #cfc2ae; font-family: "Georgia", serif; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
      .game-time { fill: #7a7a7a; font-family: monospace; font-size: 9.5px; }
    </style>
  </defs>
  <rect width="180" height="190" class="bg"/>
  <rect width="180" height="42" class="header-bg"/>

  <!-- Avatar -->
  <g transform="translate(18, 24)">
    <circle cx="16" cy="16" r="16" fill="#2b2b2b" stroke="#171717" stroke-width="2.5"/>
    <circle cx="16" cy="16" r="14" class="avatar"/>
    <circle cx="12" cy="14" r="1.8" fill="#171717"/>
    <circle cx="20" cy="14" r="1.8" fill="#171717"/>
    <path d="M14 18 Q16 21 18 18" fill="none" stroke="#171717" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="26" cy="26" r="4.5" fill="#3ba55d" stroke="#171717" stroke-width="2"/>
  </g>

  <!-- User Info -->
  <text x="18" y="78" class="text-user">keyrex</text>
  <text x="18" y="93" class="text-sub">@keyrexdevelopment</text>

  <!-- Game RPC Box -->
  <rect x="15" y="108" width="150" height="65" class="game-box"/>
  <g transform="translate(25, 118)">
    <rect width="45" height="45" rx="5" fill="#242424"/>
    <!-- Logo inside RPC -->
    <path d="M15 12 L15 33 M15 22 L28 12 M20 19 L30 33" stroke="#e5d5be" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
  <text x="78" y="134" class="game-title">KEYWARE</text>
  <text x="78" y="146" class="text-sub">CLIENT EXTENSION</text>
  <text x="78" y="160" class="game-time">00:05:42 elapsed</text>
</svg>
