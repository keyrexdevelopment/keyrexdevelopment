<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260">
  <defs>
    <style>
      .bg { fill: #121212; rx: 16px; stroke: #262626; stroke-width: 1.5; }
      .mascot { fill: #ffffff; }
      .face { fill: #121212; }
      .mountain1 { fill: #181818; }
      .mountain2 { fill: #1f1f1f; }
      .bubble-bg { fill: #1a1a1a; rx: 10px; stroke: #2d2d2d; stroke-width: 1; }
      .text-welcome { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 700; }
      .text-sub { fill: #aaaaaa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; }
      .star { fill: #ffffff; }
    </style>
  </defs>
  <rect width="360" height="260" class="bg"/>

  <!-- Stars in sky -->
  <circle cx="45" cy="40" r="1.5" class="star" opacity="0.8"/>
  <circle cx="110" cy="25" r="1" class="star" opacity="0.5"/>
  <circle cx="180" cy="45" r="2" class="star" opacity="0.9"/>
  <circle cx="280" cy="30" r="1.5" class="star" opacity="0.7"/>
  <circle cx="320" cy="60" r="1" class="star" opacity="0.4"/>

  <!-- Moon -->
  <circle cx="300" cy="40" r="14" fill="#222222"/>
  <circle cx="304" cy="36" r="12" fill="#121212"/>

  <!-- Mountains background -->
  <polygon points="0,260 75,120 160,260" class="mountain1"/>
  <polygon points="110,260 210,90 310,260" class="mountain2"/>
  <polygon points="240,260 320,140 360,260" class="mountain1"/>

  <!-- Flag on mountain summit -->
  <line x1="210" y1="90" x2="210" y2="65" stroke="#ffffff" stroke-width="2"/>
  <polygon points="210,65 235,73 210,81" fill="#ffffff"/>

  <!-- Speech Bubble -->
  <rect x="25" y="115" width="200" height="70" class="bubble-bg"/>
  <text x="40" y="142" class="text-welcome">I hope you enjoy</text>
  <text x="40" y="162" class="text-welcome">exploring my work!</text>
  <text x="40" y="178" class="text-sub">Built with zero bloat &amp; pure speed.</text>

  <!-- Mascot in scarf sitting on right -->
  <g transform="translate(240, 140)">
    <ellipse cx="40" cy="110" rx="40" ry="8" fill="#0d0d0d"/>
    <path d="M5 105 C5 65, 20 40, 40 40 C60 40, 75 65, 75 105 Z" class="mascot"/>
    <circle cx="40" cy="30" r="28" class="mascot"/>
    <!-- Face -->
    <circle cx="32" cy="28" r="2.5" class="face"/>
    <circle cx="48" cy="28" r="2.5" class="face"/>
    <path d="M36 34 Q40 38 44 34" fill="none" stroke="#121212" stroke-width="2" stroke-linecap="round"/>
    <!-- Scarf in silver -->
    <path d="M16 48 Q40 56 64 48 Q56 60 16 58 Z" fill="#cccccc"/>
    <rect x="48" y="52" width="10" height="30" rx="3" fill="#cccccc" transform="rotate(15 48 52)"/>
  </g>
</svg>
