<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="380" height="240">
  <defs>
    <style>
      .bg { fill: #111111; rx: 14px; stroke: #242424; stroke-width: 1.5; }
      .mascot { fill: #ffffff; }
      .face { fill: #111111; }
      .mountain1 { fill: #171717; }
      .mountain2 { fill: #1e1e1e; }
      .bubble-bg { fill: #181818; rx: 10px; stroke: #262626; stroke-width: 1; }
      .sub-header { fill: #666666; font-family: monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; }
      .quote-title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; }
      .quote-desc { fill: #a0a0a0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; line-height: 1.5; }
      .status-pill { fill: #181818; rx: 5px; stroke: #282828; stroke-width: 1; }
      .status-text { fill: #ffffff; font-family: monospace; font-size: 10px; font-weight: 600; }
      .dot-green { fill: #23a55a; }
      .star { fill: #ffffff; }
    </style>
  </defs>
  <rect width="380" height="240" class="bg"/>

  <!-- Stars in sky -->
  <circle cx="40" cy="35" r="1.5" class="star" opacity="0.7"/>
  <circle cx="110" cy="20" r="1" class="star" opacity="0.4"/>
  <circle cx="200" cy="35" r="2" class="star" opacity="0.9"/>
  <circle cx="310" cy="25" r="1.5" class="star" opacity="0.6"/>

  <!-- Moon Silhouette -->
  <circle cx="330" cy="45" r="14" fill="#1c1c1c"/>
  <circle cx="334" cy="41" r="12" fill="#111111"/>

  <!-- Mountain Silhouette on Bottom Right -->
  <polygon points="180,240 260,110 340,240" class="mountain1"/>
  <polygon points="260,240 330,130 380,240" class="mountain2"/>

  <!-- Flag on mountain summit -->
  <line x1="260" y1="110" x2="260" y2="90" stroke="#ffffff" stroke-width="1.8"/>
  <polygon points="260,90 280,97 260,104" fill="#ffffff"/>

  <!-- Left Content: Philosophy Quote -->
  <g transform="translate(25, 28)">
    <text x="0" y="0" class="sub-header">// PHILOSOPHY</text>
    
    <rect x="0" y="16" width="230" height="115" class="bubble-bg"/>
    <text x="14" y="40" class="quote-title">"Zero bloat. Pure speed."</text>
    <text x="14" y="64" class="quote-desc">Dedicated to crafting clean,</text>
    <text x="14" y="82" class="quote-desc">deterministic client pipelines</text>
    <text x="14" y="100" class="quote-desc">&amp; bespoke dark aesthetics.</text>

    <!-- Status Pill -->
    <g transform="translate(0, 142)">
      <rect width="210" height="26" class="status-pill"/>
      <circle cx="14" cy="13" r="3.5" class="dot-green"/>
      <text x="24" y="17" class="status-text">Building KeyWare Ecosystem</text>
    </g>
  </g>

  <!-- Mascot in scarf looking at stars on right -->
  <g transform="translate(275, 135)">
    <ellipse cx="32" cy="95" rx="30" ry="7" fill="#0c0c0c"/>
    <path d="M4 90 C4 50, 16 28, 32 28 C48 28, 60 50, 60 90 Z" class="mascot"/>
    <circle cx="32" cy="22" r="22" class="mascot"/>
    <!-- Face looking up-right -->
    <circle cx="26" cy="19" r="2" class="face"/><circle cx="38" cy="19" r="2" class="face"/>
    <path d="M29 25 Q32 28 35 25" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Scarf -->
    <path d="M12 36 Q32 44 52 36 Q46 46 12 44 Z" fill="#cccccc"/>
    <rect x="38" y="40" width="8" height="24" rx="2" fill="#cccccc" transform="rotate(15 38 40)"/>
  </g>
</svg>
