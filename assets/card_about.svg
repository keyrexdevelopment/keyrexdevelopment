<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 260" width="540" height="260">
  <defs>
    <style>
      .bg { fill: #121212; rx: 16px; stroke: #262626; stroke-width: 1.5; }
      .mascot { fill: #ffffff; }
      .face { fill: #121212; }
      .bubble-bg { fill: #1a1a1a; rx: 12px; stroke: #2a2a2a; stroke-width: 1; }
      .tag-bg { fill: #222222; rx: 6px; stroke: #333333; stroke-width: 1; }
      .tag-text { fill: #a0a0a0; font-family: monospace; font-size: 10px; font-weight: 600; }
      .text-title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 800; }
      .text-body { fill: #cccccc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; line-height: 1.6; }
      .text-highlight { fill: #ffffff; font-weight: 700; text-decoration: underline; }
      .sub-header { fill: #888888; font-family: monospace; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
    </style>
  </defs>
  <rect width="540" height="260" class="bg"/>

  <!-- Left Side: Mascot Character sitting comfortably -->
  <g transform="translate(45, 75)">
    <!-- Shadow -->
    <ellipse cx="60" cy="155" rx="55" ry="10" fill="#0d0d0d"/>
    
    <!-- Body -->
    <path d="M10 150 C10 85, 30 50, 60 50 C90 50, 110 85, 110 150 Z" class="mascot"/>
    <!-- Head -->
    <circle cx="60" cy="40" r="48" class="mascot"/>
    <!-- Eyes & Big Warm Smile -->
    <circle cx="48" cy="38" r="4" class="face"/>
    <circle cx="72" cy="38" r="4" class="face"/>
    <!-- Blush -->
    <ellipse cx="40" cy="48" rx="5" ry="2.5" fill="#e0e0e0"/>
    <ellipse cx="80" cy="48" rx="5" ry="2.5" fill="#e0e0e0"/>
    <!-- Happy Smile -->
    <path d="M52 46 Q60 58 68 46" fill="none" stroke="#121212" stroke-width="3" stroke-linecap="round"/>
    <!-- Coffee Mug -->
    <g transform="translate(75, 105)">
      <rect width="24" height="28" rx="4" fill="#1e1e1e" stroke="#333333" stroke-width="1.5"/>
      <path d="M24 6 Q32 6 32 14 Q32 22 24 22" fill="none" stroke="#333333" stroke-width="2"/>
      <!-- Steam -->
      <path d="M8 -4 Q12 -10 8 -16" fill="none" stroke="#666666" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M16 -4 Q20 -10 16 -16" fill="none" stroke="#666666" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Right Side: Content Box -->
  <g transform="translate(185, 30)">
    <text x="0" y="0" class="sub-header">// DEVELOPER &amp; CREATOR</text>
    <text x="0" y="28" class="text-title">Hey, I'm keyrex</text>
    
    <!-- Speech Box -->
    <rect x="0" y="44" width="325" height="110" class="bubble-bg"/>
    <text x="16" y="70" class="text-body">Lead engineer at <tspan class="text-highlight">Keyrex Development</tspan>.</text>
    <text x="16" y="94" class="text-body">I build high-performance client extensions,</text>
    <text x="16" y="118" class="text-body">reverse-engineered tools, and tailored</text>
    <text x="16" y="140" class="text-body">desktop software.</text>

    <!-- Tag Pills -->
    <g transform="translate(0, 166)">
      <rect x="0" y="0" width="95" height="24" class="tag-bg"/>
      <text x="10" y="16" class="tag-text">Client Mods</text>

      <rect x="105" y="0" width="105" height="24" class="tag-bg"/>
      <text x="115" y="16" class="tag-text">Reverse Eng</text>

      <rect x="220" y="0" width="105" height="24" class="tag-bg"/>
      <text x="230" y="16" class="tag-text">UI / Shaders</text>
    </g>
  </g>
</svg>
