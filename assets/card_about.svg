<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" width="520" height="240">
  <defs>
    <style>
      .bg { fill: #111111; rx: 14px; stroke: #242424; stroke-width: 1.5; }
      .mascot { fill: #ffffff; }
      .face { fill: #111111; }
      .bubble-bg { fill: #181818; rx: 10px; stroke: #262626; stroke-width: 1; }
      .tag-bg { fill: #1a1a1a; rx: 5px; stroke: #282828; stroke-width: 1; }
      .tag-text { fill: #888888; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; }
      .text-title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 17px; font-weight: 800; }
      .text-body { fill: #c0c0c0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; line-height: 1.5; }
      .text-highlight { fill: #ffffff; font-weight: 700; text-decoration: underline; }
      .sub-header { fill: #666666; font-family: monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; }
    </style>
  </defs>
  <rect width="520" height="240" class="bg"/>

  <!-- Left Mascot with Steaming Mug -->
  <g transform="translate(40, 65)">
    <ellipse cx="55" cy="145" rx="50" ry="9" fill="#0c0c0c"/>
    <path d="M10 140 C10 80, 28 45, 55 45 C82 45, 100 80, 100 140 Z" class="mascot"/>
    <circle cx="55" cy="35" r="42" class="mascot"/>
    <!-- Face -->
    <circle cx="44" cy="34" r="3.5" class="face"/>
    <circle cx="66" cy="34" r="3.5" class="face"/>
    <path d="M48 42 Q55 52 62 42" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Coffee Mug -->
    <g transform="translate(70, 95)">
      <rect width="22" height="26" rx="3" fill="#1c1c1c" stroke="#2c2c2c" stroke-width="1.2"/>
      <path d="M22 6 Q29 6 29 13 Q29 20 22 20" fill="none" stroke="#2c2c2c" stroke-width="1.5"/>
      <path d="M7 -4 Q10 -9 7 -14" fill="none" stroke="#555555" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M15 -4 Q18 -9 15 -14" fill="none" stroke="#555555" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Right Content Box -->
  <g transform="translate(175, 28)">
    <text x="0" y="0" class="sub-header">// CORE DEVELOPER</text>
    <text x="0" y="26" class="text-title">Hey, I'm keyrex</text>
    
    <!-- Speech Box -->
    <rect x="0" y="40" width="315" height="100" class="bubble-bg"/>
    <text x="14" y="64" class="text-body">Lead engineer at <tspan class="text-highlight">Keyrex Development</tspan>.</text>
    <text x="14" y="86" class="text-body">Specializing in high-performance Discord client</text>
    <text x="14" y="108" class="text-body">extensions, reverse-engineered desktop tools</text>
    <text x="14" y="128" class="text-body">&amp; tailored system modifications.</text>

    <!-- Tag Pills with Separate Exact Coordinates -->
    <g transform="translate(0, 150)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="92" height="24" class="tag-bg"/>
        <text x="12" y="16" class="tag-text">Client Mods</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(102, 0)">
        <rect width="102" height="24" class="tag-bg"/>
        <text x="12" y="16" class="tag-text">Reverse Eng</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(214, 0)">
        <rect width="96" height="24" class="tag-bg"/>
        <text x="12" y="16" class="tag-text">UI Shaders</text>
      </g>
    </g>
  </g>
</svg>
