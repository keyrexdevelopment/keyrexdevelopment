<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 190" width="380" height="190">
  <defs>
    <style>
      .bg { fill: #111111; rx: 12px; stroke: #262626; stroke-width: 1.5; }
      .mascot { fill: #ffffff; }
      .face { fill: #111111; }
      .bubble-bg { fill: #1a1a1a; rx: 6px; stroke: #2d2d2d; stroke-width: 1; }
      .text-body { fill: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 600; }
      .c0 { fill: #1a1a1a; rx: 2.5px; }
      .c1 { fill: #333333; rx: 2.5px; }
      .c2 { fill: #666666; rx: 2.5px; }
      .c3 { fill: #aaaaaa; rx: 2.5px; }
      .c4 { fill: #ffffff; rx: 2.5px; }
    </style>
  </defs>
  <rect width="380" height="190" class="bg"/>

  <!-- Peeking mascot on left in pure white -->
  <g transform="translate(10, 105)">
