<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 190" width="200" height="190">
  <defs>
    <style>
      .bg { fill: #171717; rx: 12px; stroke: #2a2a2a; stroke-width: 1.5; }
      .mascot { fill: #e5d5be; }
      .face { fill: #171717; }
      .thumb { fill: #222222; rx: 6px; stroke: #333333; stroke-width: 1; }
      .text-title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 700; }
      .text-artist { fill: #8a8a8a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; }
      .text-time { fill: #6e6e6e; font-family: monospace; font-size: 9px; }
      .bar-bg { fill: #2a2a2a; rx: 2px; }
      .bar-fill { fill: #e5d5be; rx: 2px; }
      .btn-arrow { fill: #202020; stroke: #333333; stroke-width: 1; }
    </style>
  </defs>
  <rect width="200" height="190" class="bg"/>

  <!-- Album Thumbnail -->
  <rect x="18" y="18" width="46" height="46" class="thumb"/>
  <g transform="translate(25, 25)">
    <!-- Audio Waveform icon inside thumb -->
    <path d="M4 16 L4 18 M10 8 L10 26 M16 2 L16 32 M22 10 L22 24 M28 14 L28 20" stroke="#e5d5be" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Title & Artist -->
  <text x="18" y="85" class="text-title">KeyWare Audio Engine</text>
  <text x="18" y="100" class="text-artist">Per-User Notification Hook</text>
  <text x="18" y="115" class="text-artist">Dispatcher Pre-Interception</text>

  <!-- Progress Bar -->
  <rect x="18" y="132" width="120" height="3.5" class="bar-bg"/>
  <rect x="18" y="132" width="70" height="3.5" class="bar-fill"/>

  <!-- Time -->
  <text x="18" y="152" class="text-time">1:51</text>
  <text x="115" y="152" class="text-time">3:20</text>

  <!-- Headphone Mascot peeking from right -->
  <g transform="translate(145, 105)">
    <circle cx="25" cy="25" r="22" class="mascot"/>
    <circle cx="18" cy="24" r="2" class="face"/><circle cx="28" cy="24" r="2" class="face"/>
    <path d="M20 30 Q23 33 26 30" fill="none" stroke="#171717" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Headphones -->
    <path d="M6 25 A 20 20 0 0 1 44 25" fill="none" stroke="#171717" stroke-width="3.5"/>
    <rect x="4" y="20" width="5" height="12" rx="2" fill="#171717"/>
    <rect x="41" y="20" width="5" height="12" rx="2" fill="#171717"/>
  </g>

  <!-- Arrow button in bottom right -->
  <g transform="translate(155, 145)">
    <circle cx="14" cy="14" r="13" class="btn-arrow"/>
    <path d="M10 18 L18 10 M12 10 L18 10 L18 16" fill="none" stroke="#cfc2ae" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
