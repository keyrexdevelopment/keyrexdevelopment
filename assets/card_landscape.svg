<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 190" width="410" height="190">
  <defs>
    <style>
      .bg { fill: #171717; rx: 12px; stroke: #2a2a2a; stroke-width: 1.5; }
      .mascot { fill: #e5d5be; }
      .face { fill: #171717; }
      .castle { fill: #242424; }
      .castle-roof { fill: #1a1a1a; stroke: #2d2d2d; stroke-width: 1.5; }
      .bubble-bg { fill: #202020; rx: 6px; stroke: #333333; stroke-width: 1; }
      .text-body { fill: #cfc2ae; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 600; }
      .btn-arrow { fill: #202020; stroke: #333333; stroke-width: 1; }
    </style>
  </defs>
  <rect width="410" height="190" class="bg"/>

  <!-- Moon / Sun silhouette -->
  <circle cx="50" cy="50" r="16" fill="#262626"/>
  <text x="44" y="55" fill="#cfc2ae" font-family="monospace" font-size="14" font-weight="bold">K</text>

  <!-- Japanese Castle Silhouette -->
  <g transform="translate(110, 45)">
    <!-- Base -->
    <polygon points="40,145 140,145 130,95 50,95" class="castle"/>
    <!-- Level 1 Roof -->
    <path d="M25 100 Q90 85 155 100 L145 92 Q90 80 35 92 Z" class="castle-roof"/>
    <polygon points="55,92 125,92 118,65 62,65" class="castle"/>
    <!-- Level 2 Roof -->
    <path d="M40 70 Q90 58 140 70 L132 63 Q90 52 48 63 Z" class="castle-roof"/>
    <polygon points="68,63 112,63 108,42 72,42" class="castle"/>
    <!-- Level 3 Roof Top -->
    <path d="M55 45 Q90 35 125 45 L118 38 Q90 28 62 38 Z" class="castle-roof"/>
  </g>

  <!-- Cherry blossom petals floating -->
  <circle cx="210" cy="40" r="3" fill="#cfc2ae" opacity="0.6"/>
  <circle cx="240" cy="65" r="2" fill="#cfc2ae" opacity="0.4"/>
  <circle cx="180" cy="75" r="2.5" fill="#cfc2ae" opacity="0.5"/>
  <circle cx="260" cy="45" r="3.5" fill="#cfc2ae" opacity="0.7"/>

  <!-- Mascots standing in front of castle -->
  <!-- Mascot 1 -->
  <g transform="translate(200, 135)">
    <path d="M0 55 C0 25, 8 10, 20 10 C32 10, 40 25, 40 55 Z" class="mascot"/>
    <circle cx="20" cy="6" r="14" class="mascot"/>
    <circle cx="16" cy="4" r="1.5" class="face"/><circle cx="24" cy="4" r="1.5" class="face"/>
  </g>
  <!-- Mascot 2 -->
  <g transform="translate(230, 138)">
    <path d="M0 55 C0 25, 8 10, 20 10 C32 10, 40 25, 40 55 Z" class="mascot"/>
    <circle cx="20" cy="6" r="14" class="mascot"/>
    <circle cx="16" cy="4" r="1.5" class="face"/><circle cx="24" cy="4" r="1.5" class="face"/>
  </g>
  <!-- Mascot 3 (Tie) -->
  <g transform="translate(260, 135)">
    <path d="M0 55 C0 25, 8 10, 20 10 C32 10, 40 25, 40 55 Z" class="mascot"/>
    <circle cx="20" cy="6" r="14" class="mascot"/>
    <circle cx="16" cy="4" r="1.5" class="face"/><circle cx="24" cy="4" r="1.5" class="face"/>
    <!-- Tie -->
    <polygon points="18,18 22,18 24,36 20,40 16,36" fill="#171717"/>
  </g>
  <!-- Mascot 4 (Flower) -->
  <g transform="translate(290, 138)">
    <path d="M0 55 C0 25, 8 10, 20 10 C32 10, 40 25, 40 55 Z" class="mascot"/>
    <circle cx="20" cy="6" r="14" class="mascot"/>
    <circle cx="16" cy="4" r="1.5" class="face"/><circle cx="24" cy="4" r="1.5" class="face"/>
    <circle cx="27" cy="-2" r="3" fill="#ffffff"/>
  </g>

  <!-- Mascot peeking from top right with speech bubble -->
  <g transform="translate(345, 10)">
    <circle cx="24" cy="24" r="22" class="mascot"/>
    <circle cx="17" cy="22" r="2" class="face"/><circle cx="27" cy="22" r="2" class="face"/>
    <path d="M19 28 Q22 31 25 28" fill="none" stroke="#171717" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <rect x="315" y="70" width="80" height="42" class="bubble-bg"/>
  <text x="323" y="87" class="text-body">Explore</text>
  <text x="323" y="101" class="text-body">KeyWare!</text>

  <!-- Arrow button in bottom right -->
  <g transform="translate(365, 145)">
    <circle cx="15" cy="15" r="14" class="btn-arrow"/>
    <path d="M11 19 L19 11 M13 11 L19 11 L19 17" fill="none" stroke="#cfc2ae" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
