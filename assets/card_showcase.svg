<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 150" width="920" height="150">
  <defs>
    <style>
      .bg { fill: #121212; rx: 16px; stroke: #262626; stroke-width: 1.5; }
      .badge-bg { fill: #1c1c1c; rx: 5px; stroke: #2f2f2f; stroke-width: 1; }
      .badge-text { fill: #e0e0e0; font-family: monospace; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; }
      .title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }
      .desc { fill: #aaaaaa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; line-height: 1.5; }
      .sub-info { fill: #666666; font-family: monospace; font-size: 11px; }
      .btn-bg { fill: #ffffff; rx: 8px; }
      .btn-text { fill: #121212; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 800; }
    </style>
  </defs>
  <rect width="920" height="150" class="bg"/>

  <!-- Left Content (No logo, starts directly with clean typography) -->
  <g transform="translate(45, 30)">
    <!-- Badge -->
    <rect width="140" height="22" class="badge-bg"/>
    <text x="12" y="15" class="badge-text">FEATURED WORK</text>

    <!-- Title -->
    <text x="0" y="52" class="title">KEYWARE // DMs</text>

    <!-- Description -->
    <text x="0" y="78" class="desc">Modular Direct Messages workspace for BetterDiscord featuring audio dispatch interception, 0ms React DOM &amp; GPU shaders.</text>
    
    <!-- Sub info -->
    <text x="0" y="98" class="sub-info">v5.8.1 • BetterDiscord Plugin • TypeScript &amp; Vanilla JS</text>
  </g>

  <!-- Right Button: View on GitHub -->
  <g transform="translate(730, 53)">
    <rect width="150" height="44" class="btn-bg"/>
    <text x="22" y="27" class="btn-text">View Project ↗</text>
  </g>
</svg>
