<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="920" height="180">
  <defs>
    <style>
      .bg { fill: #121212; rx: 16px; stroke: #262626; stroke-width: 1.5; }
      .badge-bg { fill: #1e1e1e; rx: 6px; stroke: #333333; stroke-width: 1; }
      .badge-text { fill: #ffffff; font-family: monospace; font-size: 10px; font-weight: 700; letter-spacing: 1px; }
      .title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }
      .desc { fill: #cccccc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; line-height: 1.5; }
      .feat-pill { fill: #1a1a1a; rx: 6px; stroke: #2a2a2a; stroke-width: 1; }
      .feat-text { fill: #888888; font-family: monospace; font-size: 11px; }
      .feat-bold { fill: #ffffff; font-weight: 700; }
      .btn-bg { fill: #ffffff; rx: 8px; }
      .btn-text { fill: #121212; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; }
      .monogram-bg { fill: #181818; rx: 12px; stroke: #282828; stroke-width: 1; }
    </style>
  </defs>
  <rect width="920" height="180" class="bg"/>

  <!-- Left Icon / Monogram -->
  <g transform="translate(30, 35)">
    <rect width="110" height="110" class="monogram-bg"/>
    <!-- KW Monogram Artwork -->
    <path d="M35 30 L35 80 M35 55 L70 30 M45 50 L75 80" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Middle Content -->
  <g transform="translate(165, 32)">
    <!-- Badge -->
    <rect width="135" height="22" class="badge-bg"/>
    <text x="10" y="15" class="badge-text">★ FEATURED WORK</text>

    <!-- Title -->
    <text x="0" y="48" class="title">KEYWARE // DMs</text>

    <!-- Description -->
    <text x="0" y="74" class="desc">Modular Direct Messages workspace for BetterDiscord featuring per-user audio interception,</text>
    <text x="0" y="94" class="desc">0ms synchronous React-Safe DOM ordering, and real-time GPU particle shaders.</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 108)">
      <rect x="0" y="0" width="130" height="24" class="feat-pill"/>
      <text x="10" y="16" class="feat-text"><tspan class="feat-bold">⚡ 0ms</tspan> Instant Sync</text>

      <rect x="140" y="0" width="140" height="24" class="feat-pill"/>
      <text x="10" y="16" class="feat-text"><tspan class="feat-bold">🎧 Audio</tspan> Dispatcher</text>

      <rect x="290" y="0" width="130" height="24" class="feat-pill"/>
      <text x="10" y="16" class="feat-text"><tspan class="feat-bold">✨ UI</tspan> Shaders Engine</text>
    </g>
  </g>

  <!-- Right Button: View on GitHub -->
  <g transform="translate(730, 68)">
    <rect width="155" height="44" class="btn-bg"/>
    <text x="24" y="27" class="btn-text">View Project ↗</text>
  </g>
</svg>
