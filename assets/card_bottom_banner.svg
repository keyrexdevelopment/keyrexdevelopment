<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="920" height="260">
  <defs>
    <style>
      .bg { fill: #121212; rx: 16px; stroke: #262626; stroke-width: 1.5; }
      .mascot { fill: #ffffff; }
      .face { fill: #121212; }
      .castle { fill: #181818; }
      .castle-roof { fill: #141414; stroke: #262626; stroke-width: 1.5; }
      .bubble-bg { fill: #1a1a1a; rx: 10px; stroke: #2d2d2d; stroke-width: 1; }
      .title-welcome { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }
      .text-desc { fill: #cccccc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; line-height: 1.5; }
      .text-tagline { fill: #888888; font-family: monospace; font-size: 11.5px; font-weight: 600; }
      .star { fill: #ffffff; }
      .petal { fill: #ffffff; opacity: 0.7; }
    </style>
  </defs>
  <rect width="920" height="260" class="bg"/>

  <!-- Stars in sky -->
  <circle cx="60" cy="40" r="1.5" class="star" opacity="0.6"/>
  <circle cx="160" cy="30" r="1" class="star" opacity="0.4"/>
  <circle cx="280" cy="50" r="2" class="star" opacity="0.8"/>
  <circle cx="420" cy="35" r="1.5" class="star" opacity="0.5"/>
  <circle cx="620" cy="45" r="2" class="star" opacity="0.9"/>
  <circle cx="780" cy="30" r="1.5" class="star" opacity="0.6"/>
  <circle cx="860" cy="55" r="1" class="star" opacity="0.4"/>

  <!-- Moon Silhouette -->
  <circle cx="820" cy="65" r="22" fill="#202020"/>
  <circle cx="825" cy="60" r="19" fill="#121212"/>

  <!-- Background Castle Silhouettes on Right -->
  <g transform="translate(680, 80)">
    <!-- Base -->
    <polygon points="30,180 150,180 140,120 40,120" class="castle"/>
    <!-- Level 1 Roof -->
    <path d="M15 125 Q90 105 165 125 L155 115 Q90 98 25 115 Z" class="castle-roof"/>
    <polygon points="50,115 130,115 122,80 58,80" class="castle"/>
    <!-- Level 2 Roof -->
    <path d="M35 85 Q90 70 145 85 L135 76 Q90 62 45 76 Z" class="castle-roof"/>
    <polygon points="65,76 115,76 110,48 70,48" class="castle"/>
    <!-- Level 3 Roof -->
    <path d="M50 52 Q90 40 130 52 L122 44 Q90 32 58 44 Z" class="castle-roof"/>
  </g>

  <!-- Left Side: Friendly Mascot Crew -->
  <!-- Mascot 1 (Waving) -->
  <g transform="translate(60, 125)">
    <ellipse cx="30" cy="125" rx="30" ry="7" fill="#0d0d0d"/>
    <path d="M0 120 C0 65, 12 35, 30 35 C48 35, 60 65, 60 120 Z" class="mascot"/>
    <circle cx="30" cy="24" r="24" class="mascot"/>
    <!-- Face -->
    <circle cx="23" cy="22" r="2.2" class="face"/><circle cx="37" cy="22" r="2.2" class="face"/>
    <path d="M26 28 Q30 32 34 28" fill="none" stroke="#121212" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Waving Arm -->
    <path d="M54 50 Q72 30 70 15 Q64 12 58 35" fill="#ffffff"/>
  </g>

  <!-- Mascot 2 (Scarf) -->
  <g transform="translate(140, 130)">
    <ellipse cx="30" cy="120" rx="30" ry="7" fill="#0d0d0d"/>
    <path d="M0 115 C0 65, 12 35, 30 35 C48 35, 60 65, 60 115 Z" class="mascot"/>
    <circle cx="30" cy="24" r="24" class="mascot"/>
    <circle cx="23" cy="22" r="2.2" class="face"/><circle cx="37" cy="22" r="2.2" class="face"/>
    <path d="M26 28 Q30 32 34 28" fill="none" stroke="#121212" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Scarf -->
    <path d="M10 40 Q30 48 50 40 Q44 50 10 48 Z" fill="#cccccc"/>
    <rect x="36" y="44" width="8" height="24" rx="2" fill="#cccccc" transform="rotate(12 36 44)"/>
  </g>

  <!-- Mascot 3 (Cute with Coffee) -->
  <g transform="translate(220, 135)">
    <ellipse cx="30" cy="115" rx="30" ry="7" fill="#0d0d0d"/>
    <path d="M0 110 C0 65, 12 35, 30 35 C48 35, 60 65, 60 110 Z" class="mascot"/>
    <circle cx="30" cy="24" r="24" class="mascot"/>
    <circle cx="23" cy="22" r="2.2" class="face"/><circle cx="37" cy="22" r="2.2" class="face"/>
    <path d="M26 28 Q30 32 34 28" fill="none" stroke="#121212" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Little Mug -->
    <rect x="42" y="55" width="14" height="18" rx="2" fill="#1e1e1e" stroke="#333333" stroke-width="1"/>
  </g>

  <!-- Middle Large Welcoming Slogan Card -->
  <g transform="translate(325, 45)">
    <rect width="360" height="170" class="bubble-bg"/>
    <g transform="translate(25, 30)">
      <text x="0" y="0" class="title-welcome">I hope you enjoy exploring my work!</text>
      <text x="0" y="32" class="text-desc">Always building, experimenting, and refining.</text>
      <text x="0" y="54" class="text-desc">Focused on pure performance, zero overhead &amp;</text>
      <text x="0" y="74" class="text-desc">uncompromising dark aesthetics.</text>
      
      <!-- Tagline -->
      <text x="0" y="112" class="text-tagline">Crafted with passion by keyrex • 2026</text>
    </g>
  </g>

  <!-- Floating Petals -->
  <circle cx="300" cy="60" r="2.5" class="petal"/>
  <circle cx="340" cy="90" r="1.8" class="petal"/>
  <circle cx="270" cy="110" r="2.2" class="petal"/>
  <circle cx="720" cy="50" r="3" class="petal"/>
  <circle cx="760" cy="80" r="2" class="petal"/>
  <circle cx="680" cy="100" r="2.5" class="petal"/>
</svg>
